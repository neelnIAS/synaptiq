name: Synaptiq CI
on: [push, pull_request]
jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r apps/api/requirements.txt
      - run: python -m compileall apps/api
